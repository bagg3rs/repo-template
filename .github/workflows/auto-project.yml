name: Auto-add issues to project board
on:
  issues:
    types: [opened]

jobs:
  add-to-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/add-to-project@v2
        with:
          project-url: https://github.com/users/bagg3rs/projects/YOUR_PROJECT_NUMBER
          github-token: ${{ secrets.PROJECT_TOKEN }}
